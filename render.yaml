# Render Blueprint: free web service for the online247now.x store API.
# Secrets marked "sync: false" are entered by you in the Render dashboard.
services:
  - type: web
    name: online247now-store
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_ORIGIN
        value: https://online247now.netlify.app
      - key: CHAIN_ID
        value: "8453"
      - key: RPC_URL
        value: https://mainnet.base.org
      - key: CONFIRMATIONS
        value: "12"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYOUT_WALLET
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
